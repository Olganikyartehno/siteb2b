name: Deploy to Netlify

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  trigger-netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        run: |
          curl -sS -X POST -H "Content-Type: application/json" -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
